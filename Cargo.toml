[workspace]
members = [
  "blots-core",
  "blots",
  "blots-wasm",
]
resolver = "2"

[workspace.package]
rust-version = "1.89"
version = "0.15.0"
authors = ["Paul Russo <paul@paulrusso.me>"]
edition = "2024"
repository = "https://github.com/paul-russo/blots-lang"
homepage = "https://github.com/paul-russo/blots-lang"
license = "MIT"

[workspace.dependencies]
# Internal crates - these will use path during development, version during publishing
blots-core = { path = "blots-core", version = "0.15.0" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)', 'cfg(blots_vm_step_only)'] }

# Optimize the whole program as one unit. Release builds take about twice as long, but the
# binary is a fifth smaller, which is most of what starting it costs, and a little faster.
[profile.release]
lto = "fat"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
