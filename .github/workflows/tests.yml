name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install cargo-nextest and wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,wasm-pack

      - name: Run tests
        run: just test-ci
